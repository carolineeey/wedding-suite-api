databases:
  - name: wedding-suite-db
    plan: free
    databaseName: wedding_suite
    user: wedding_suite

services:
  - type: web
    name: wedding-suite-api
    runtime: go
    plan: free
    branch: main
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-suite-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false # set manually in the Render dashboard, keep it secret
      - key: ALLOW_ORIGINS
        value: "*" # tighten to your frontend's real domain once it exists
      - key: PORT
        value: "8080"
